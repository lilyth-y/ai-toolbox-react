name: React App CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - "ai-toolbox-react/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "ai-toolbox-react/**"
      - ".github/workflows/ci-cd.yml"

concurrency:
  group: react-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-toolbox-react

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: ai-toolbox-react/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Build app
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-toolbox-react-dist
          path: ai-toolbox-react/dist/
          retention-days: 7

  deploy-firebase:
    name: Deploy to Firebase Hosting
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-toolbox-react

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: ai-toolbox-react/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build app for production
        run: npm run build
        env:
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_ADSENSE_CLIENT_ID: ${{ secrets.VITE_ADSENSE_CLIENT_ID }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
